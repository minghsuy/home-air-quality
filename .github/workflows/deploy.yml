# Builds the MkDocs site and publishes it to GitHub Pages.
name: Deploy guide to GitHub Pages

# WHEN this runs:
on:
  push:
    branches: [main]        # merges to main → build AND publish
  pull_request:             # PRs → build only (catch breakage before it merges)
  workflow_dispatch:        # + a manual "Run workflow" button

# WHAT it may do (least privilege — only what Pages needs):
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build the static site. Runs on BOTH pushes and PRs, so a PR that breaks the
  # build (or an internal link, via --strict) fails its checks before you merge.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material>=9,<10"
      - run: mkdocs build --strict          # renders docs/ into ./site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Publish to Pages — only on a real push to main, never from a PR.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'   # the conditional that skips PR deploys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
